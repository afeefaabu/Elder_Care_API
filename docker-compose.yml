version: '3.8'

services:
  api:
    build: .
    container_name: elder_care_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/elder_care
      - SECRET_KEY=prod-secret-key-change-in-production
      - MOCK_EXTERNAL_SERVICES=True
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    container_name: elder_care_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=elder_care
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: elder_care_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
